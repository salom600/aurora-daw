[package]
name = "aurora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AURORA Producer Suite — virtual studio DAW"

[[bin]]
name = "aurora-daw"
path = "src/main.rs"

[features]
debug_record = []

[dependencies]
aurora-engine = { path = "../aurora-engine" }
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow", "wgpu", "default_fonts", "x11", "accesskit"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rustfft = "6.2"
rtrb = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
